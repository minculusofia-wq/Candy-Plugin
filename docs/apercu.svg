<svg xmlns="http://www.w3.org/2000/svg" width="920" height="602" viewBox="0 0 920 602" role="img" aria-label="Sortie du controle universel : TOUT PASSE sur un projet, AUCUN MOYEN DE VERIFICATION TROUVE sur un autre">
<title>Candy Plugin — le contrôle universel rend un verdict, pas un avis</title>
<rect width="920" height="602" rx="14" fill="#0F1216"/>
<rect x="16" y="16" width="888" height="570" rx="10" fill="#171B21" stroke="#2A313A"/>
<path d="M16 26a10 10 0 0 1 10-10h868a10 10 0 0 1 10 10v26H16z" fill="#1E242C"/>
<line x1="16" y1="52" x2="904" y2="52" stroke="#2A313A"/>
<circle cx="40" cy="34" r="5.5" fill="#E06C60"/>
<circle cx="60" cy="34" r="5.5" fill="#E0B341"/>
<circle cx="80" cy="34" r="5.5" fill="#5FBF95"/>
<text x="460.0" y="39" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="12" fill="#8B95A2">candy-plugin — hooks/verifier-projet.sh</text>
<text x="34" y="80" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#8FB8E8">$ </tspan><tspan fill="#E4E8ED">/verifier</tspan></text>
<text x="34" y="122" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#8B95A2">=== CONTROLE DU PROJET ===</tspan></text>
<text x="34" y="143" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#8B95A2">Projet : ~/projets/mon-app</tspan></text>
<text x="34" y="185" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#8B95A2">--- npm test ---</tspan></text>
<text x="34" y="206" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FBF95">  [OK] npm test</tspan></text>
<text x="34" y="227" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#8B95A2">--- npm run lint ---</tspan></text>
<text x="34" y="248" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FBF95">  [OK] npm run lint</tspan></text>
<text x="34" y="290" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#E4E8ED">=== VERDICT ===</tspan></text>
<text x="34" y="311" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FBF95">  OK     npm test</tspan></text>
<text x="34" y="332" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FBF95">  OK     npm run lint</tspan></text>
<text x="34" y="374" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FBF95">TOUT PASSE.</tspan></text>
<text x="34" y="437" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#8FB8E8">$ </tspan><tspan fill="#8B95A2">/verifier      # un autre projet</tspan></text>
<text x="34" y="479" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#E4E8ED">=== VERDICT ===</tspan></text>
<text x="34" y="500" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#E08A5F">AUCUN MOYEN DE VERIFICATION TROUVE dans ce projet.</tspan></text>
<text x="34" y="542" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#8B95A2">Rien ne permet de savoir si une modification casse quelque chose.</tspan></text>
<text x="34" y="563" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#8B95A2">Avant tout autre travail sur ce projet : mettre en place un controle.</tspan></text>
</svg>
